name: Nightly Deletion Simulation

on:
  schedule:
    # Run nightly at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch: # Allow manual triggers

jobs:
  deletion-simulation:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run deletion simulation
        id: simulation
        run: |
          echo "🚀 Running deletion simulation to test Rule 8: Design for Deletion"
          npm run delete-simulation 2>&1 | tee simulation.log
        continue-on-error: true

      - name: Upload simulation report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deletion-simulation-report-${{ github.run_number }}
          path: |
            deletion-simulation-*.md
            simulation.log

      - name: Create issue on failures
        if: failure() 
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            
            // Read simulation log
            let logContent = '';
            try {
              logContent = fs.readFileSync('simulation.log', 'utf8');
            } catch (error) {
              logContent = 'Could not read simulation log';
            }

            // Extract coupling violations from log
            const couplingViolations = [];
            const lines = logContent.split('\n');
            for (const line of lines) {
              if (line.includes('❌') && line.includes('Coupling violation')) {
                couplingViolations.push(line);
              }
            }

            const issueBody = `
            # 🚨 Deletion Simulation Failed - Rule 8 Violations Detected

            The nightly deletion simulation has detected coupling violations that prevent proper "design for deletion".

            ## Summary
            - **Workflow Run**: [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            - **Branch**: \`${{ github.ref_name }}\`
            - **Commit**: \`${{ github.sha }}\`

            ## Coupling Violations Found
            ${couplingViolations.length > 0 ? couplingViolations.map(v => `- ${v}`).join('\n') : 'See attached simulation report for details.'}

            ## Rule 8: Design for Deletion
            This failure indicates that components are too tightly coupled. The system should be designed so that any individual component can be deleted without breaking the build or tests.

            ## Next Steps
            1. Review the detailed simulation report in the workflow artifacts
            2. Identify and fix coupling violations
            3. Ensure components follow LEGO principles with proper abstraction
            4. Re-run the simulation to verify fixes

            ## Simulation Log
            <details>
            <summary>Click to expand simulation log</summary>

            \`\`\`
            ${logContent.slice(-5000)} // Last 5000 characters
            \`\`\`
            </details>

            /cc @Boss
            `;

            // Create issue
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 Deletion Simulation Failed - Rule 8 Violations (Run #${{ github.run_number }})`,
              body: issueBody,
              labels: ['bug', 'coupling-violation', 'rule-8', 'deletion-simulation']
            });

      - name: Comment on success
        if: success()
        run: |
          echo "✅ Deletion simulation passed - system properly designed for deletion!"
          echo "Rule 8 compliance verified: Components can be safely deleted without breaking the system."
