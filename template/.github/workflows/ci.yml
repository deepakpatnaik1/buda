name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - run: npm ci
      - name: Check Design Documentation Requirements
        run: npm run design-doc-check
        env:
          CI_BASE_BRANCH: ${{ github.event.pull_request.base.ref || 'main' }}
          CI_CURRENT_BRANCH: ${{ github.sha }}
          PR_DESCRIPTION: ${{ github.event.pull_request.body }}
      - run: npm run lint
      - run: npm run budget
      - run: npm run test:coverage
